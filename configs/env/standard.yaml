# =============================================================================
# Standard information-only environment for event-causal repair experiments.
# Dynamic corridor failures are disabled so this family measures ordinary
# report/reveal dynamics without disruption confounding.
# =============================================================================

physics:
  W_max: 2.5
  m0: 4.0
  B_max: 230.0
  e_c: 3.125
  e_v: 2.5
  beta_safe: 23.0
  v_uav: 60.0

commodities:
  w_k:      [0.25, 0.5, 1.0, 2.5]
  lambda_k: [4.0, 2.0, 3.0, 1.0]
  alpha_k:  [1.0, 1.0, 1.0, 1.0]
  kappa_k:  [0.35, 0.20, 0.30, 0.10]

belief:
  rho: 1.0
  sigma_obs: 2.0
  K_gain_mode: kalman
  belief_age_mode: oldest
  sigma0_frac: 0.4
  gamma0_range: [0.5, 0.9]
  init_report_noise_frac: 0.3

events:
  p1_rate: 0.15
  p2_reveal_window: [0.05, 0.6]
  p3_rate: 0.08
  p3_gamma_shape: 2.0
  p3_gamma_scale: 2.0
  p_P4: 0.8
  delta_P4_mean: 0.1
  sigma_P4: 1.0
  avail_closure_rate: 0.0
  avail_closure_dur: [0.5, 2.0]
  avail_hazard_threshold: 0.15

hybrid:
  K_max: 24
  omega: [1.0, 1.0, 2.0, 2.0, 0.25]
  xi_E: 0.01
  xi_R: 0.1
  xi_C: 5.0
  P_viol: 50.0
  mu_E: 0.01
  mu_R: 0.1
  alns_iterations: 60
  alns_removal_frac: 0.3
  route_depth: 4

map:
  region_km: 12.0
  n_nodes: 20
  n_hidden: 4
  n_clusters: 3
  cluster_std_km: 0.9
  feasible_frac: 0.95
  min_node_sep_km: 0.35
  nu_range: [0.5, 3.0]
  demand_mean_k: [2.0, 3.0, 2.5, 0.8]
  n_hazard_bumps: [2, 3]
  hazard_amp_range: [0.5, 1.5]
  hazard_radius_range: [1.5, 3.5]
  alpha_h: 1.0
  alpha_w: 0.3
  path_mode: euclidean
  astar_grid: 48

mission:
  T: 12.0
  M: 3
  T_load: 0.15
  T_charge: 0.5
  n_depot_bays: 2
  stock_mult: 1.2
  n_replenish: 2
  replenish_frac: 0.35
  gamma_hour: 0.98
  terminate_on_belief_zero: true
