# Event-Causal Belief-Repair ALNS experiment defaults.
#
# The mathematically valid continuation certificate uses xi_C from the
# environment when solve_cost is null.  The event-impact quantity logged by
# the controller is a secondary activation proxy, not a claimed bound. Soft
# events must exceed proxy_threshold_fraction times the current optimistic
# relief-value upper bound. Hard infeasibility bypasses this proxy screen.

method:
  # Locked on calibration seeds 440--444 after an equal-budget sweep over
  # {6, 12, 18, 24}; 18 gave the best compute-quality trade-off and was the
  # only tested setting that improved both mean deprivation and solve time on
  # the standard family versus equal-budget periodic full replanning.
  repair_budget: 18
  alns_iterations: 60
  solve_cost: null
  # Locked on held-out calibration seeds 440--444 after correcting routine
  # service feedback. Combined with budget pacing, 0.03 preserved repairs
  # across the full horizon and minimized paired deprivation among the tested
  # values {0.03, 0.05, 0.08, 0.10, 0.15}.
  proxy_threshold_fraction: 0.03
  trigger_mode: both
  periodic_replan_period: 2.0
  event_priority_budget: 6
  # Item 2b: when true, only operational events (P1/P2/P4 reports,
  # corridor changes, replenishment) may trigger repairs; fleet-service
  # soft events (loading/service/arrivals) do not trigger economic repairs;
  # genuine hard infeasibility always bypasses this optional gate.
  gate_fleet_service_triggers: false
  # Item 4: when true, non-hard repairs may fire only while the number of
  # budgeted attempts stays below the cumulative linear schedule
  # min(K_max, floor((K_max+1) * t / T)), reserving repairs for later
  # periods while releasing all slots strictly before the horizon.
  budget_pacing: true
  # Trigger ablations are enabled explicitly for the final ablation runs so
  # pilots and primary comparisons do not pay the extra solver cost.
  include_trigger_ablations: false
  # Deterministic seed-specific permutations remove fixed-order timing bias.
  randomize_method_order: true
