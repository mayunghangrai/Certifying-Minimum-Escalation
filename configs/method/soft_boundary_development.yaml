# Predeclared development specification for the post-evaluation redesign.
# Seeds 500--539 are never used for tuning this method.  Screening uses
# 600--609, confirmation uses 610--629, and 630--639 is held in reserve for
# one lock check if confirmation exposes a correctable implementation issue.

method:
  repair_budget: 18
  alns_iterations: 60
  solve_cost: null
  proxy_threshold_fraction: 0.03
  trigger_mode: proxy
  budget_pacing: true
  periodic_replan_period: 2.0
  matched_periodic_target_count: 18

  # The nested removal weights are 1, decay, decay^2, decay^3 for causal,
  # affected-route, shared-resource, and global decisions respectively.
  development_boundary_decays: [0.35, 0.65]
  development_gate_modes: [false, true]

  randomize_method_order: true

