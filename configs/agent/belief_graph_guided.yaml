# Belief-Graph Guided MAPPO-ALNS (method defaults, not tuned hyperparameters).
# Select the executable ablation with scripts/train_mappo.py --mode <name>.

method:
  observation_encoder: belief_graph
  alns_guidance: adaptive

belief_graph:
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.0
  use_edge_features: true
  max_known_nodes: derive_from_environment
  include_information_age: true
  include_cohort_urgency: true
  include_report_confidence: true

alns_guidance:
  mode: adaptive
  hidden_dim: 64
  beta: 1.0
  fixed_gate: 0.5
  log_diagnostics: true

checkpoint:
  model_version: 2
  save_optimizer_state: true
  save_feature_schema: true
