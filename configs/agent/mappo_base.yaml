# MAPPO Reinforcement Learning Hyperparameters
# These are agnostic to the specific physics scenario and define the CTDE learning behavior.

lr_actor: 0.0003
lr_critic: 0.001
gamma: 0.99
gae_lambda: 0.95
clip_param: 0.2
entropy_coef: 0.01
vloss_coef: 0.5
update_epochs: 4
hidden_dim: 256
encoder_dim: 128
num_heads: 4
num_layers: 2
batch_size: 64
num_episodes: 500
max_steps_per_episode: 200
train_seed: 42
eval_seeds: [100, 2026]
train_no_intent_ablation: false
